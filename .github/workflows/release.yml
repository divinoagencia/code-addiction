name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate and cleanup tag if exists
        working-directory: .
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Processing tag: $TAG"
          # Check if tag already exists locally
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally, this is expected for workflow trigger"
          fi
          # Verify tag matches semantic versioning
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "❌ Invalid tag format: $TAG"
            echo "Expected format: vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi
          echo "✓ Tag format valid: $TAG"

      - name: Determine release type
        id: release_type
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == *"-beta"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
            echo "Beta release detected: $TAG"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "Stable release detected: $TAG"
          fi
        working-directory: .

      # THE PUBLISH GATE, AND IT MUST COVER EVERY PATH THAT SHIPS IN THE PACKAGE.
      # `mcp/` is one of them: `scripts/build.js` copies it to `cli/src/mcp/`
      # and `npm publish` packs it. The framework ZIP step below is
      # unconditional, so a release touching only `mcp/` would otherwise ship a
      # new ZIP and skip the publish, leaving the `npx codeadd@<version>`
      # registration pinned to a package that never got the new server — the
      # exact version skew the npx distribution route exists to make impossible.
      - name: Check for CLI changes
        id: cli_changes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$PREV_TAG"..HEAD -- cli/ mcp/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in cli/ or mcp/ since $PREV_TAG — skipping publish"
          fi
        working-directory: .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        if: steps.cli_changes.outputs.changed == 'true'
        run: npm ci

      - name: Build framework
        working-directory: .
        run: node scripts/build.js

      - name: Run tests
        if: steps.cli_changes.outputs.changed == 'true'
        env:
          CODEADD_TESTS_CONTEXT: github-actions
          CODEADD_TESTS_SELECTION: cli
        run: npm test

      # GATE: pack the CLI and execute the npm-generated bin before any
      # publication work. A silent entrypoint (0.6.2 regression) must fail here.
      - name: Run package smoke test
        if: steps.cli_changes.outputs.changed == 'true'
        env:
          CODEADD_TESTS_CONTEXT: github-actions
          CODEADD_TESTS_SELECTION: package
        run: npm run test:package

      # Runs AFTER "Build framework" (node scripts/build.js) above, so the
      # gitignored, build-emitted .codeadd/injection-points.json is fresh in the
      # tree before it is packaged here. Do not reorder these steps.
      - name: Package framework zip
        working-directory: .
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          DIRS=""
          for subdir in .codeadd/scripts .codeadd/fragments .codeadd/templates .codeadd/plugins .codeadd/agent-mode .agent .agents .augment .bob .claude .codex .cursor .gemini .github .kilocode .kiro .opencode .qwen .roo .shai .windsurf .zcode; do
            [ -d "framwork/$subdir" ] && DIRS="$DIRS framwork/$subdir"
          done
          # Single-file build outputs (not subdirs) packaged explicitly.
          FILES=""
          # `|| true` is defensive, not load-bearing: `bash -e` exempts a failing
          # command inside an && list unless it is the step's LAST command. These
          # lines are followed by `zip`, so they are safe either way — the guard
          # keeps them safe if that ever stops being true. Same applies to the
          # `[ -d ] && DIRS=…` loop above.
          [ -f "framwork/.codeadd/injection-points.json" ] && FILES="$FILES framwork/.codeadd/injection-points.json" || true
          [ -f "framwork/.codeadd/contracts.json" ] && FILES="$FILES framwork/.codeadd/contracts.json" || true
          [ -f "framwork/.codeadd/artefact-graph.json" ] && FILES="$FILES framwork/.codeadd/artefact-graph.json" || true
          zip -r "code-addiction-${TAG}.zip" $DIRS $FILES
          echo "ASSET_NAME=code-addiction-${TAG}.zip" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload asset
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PRERELEASE_FLAG=""
          if [ "${{ steps.release_type.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [ -n "$NOTES" ]; then
            echo "$NOTES" > /tmp/release-notes.md
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              $PRERELEASE_FLAG \
              "${{ env.ASSET_NAME }}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              $PRERELEASE_FLAG \
              "${{ env.ASSET_NAME }}"
          fi

      - name: Publish to npm
        if: steps.cli_changes.outputs.changed == 'true'
        run: npm publish --tag ${{ steps.release_type.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The Claude Code plugin is served from the `claude-plugin` branch, which
      # `.claude-plugin/marketplace.json` on main names as the plugin source. It
      # is build output (dist/ is gitignored on main), so each stable release
      # commits a fresh snapshot on top of the branch's history. Last, so the
      # framework release its SessionStart hook installs (`--version v<tag>`)
      # already exists when the plugin reaches anyone. A beta never moves it.
      - name: Publish Claude Code plugin
        if: steps.release_type.outputs.prerelease == 'false'
        working-directory: .
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          npm --prefix cli ci
          node scripts/build-claude-plugin.js --out "$RUNNER_TEMP/claude-plugin"
          DEST="$RUNNER_TEMP/claude-plugin-branch"
          if git fetch origin claude-plugin:refs/remotes/origin/claude-plugin; then
            git worktree add -B claude-plugin "$DEST" origin/claude-plugin
          else
            git worktree add --orphan -b claude-plugin "$DEST"
          fi
          find "$DEST" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/claude-plugin/." "$DEST/"
          cd "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Claude Code plugin unchanged for $TAG"
          else
            git commit -q -m "chore(claude-plugin): codeadd $TAG"
            git push origin claude-plugin
          fi
